function runLab(){const out=[],W=Math.round(LAB.w*6),last={};for(let i=W;i<nPts();i++)for(const k in LAB.thr){const o=ols(T.m[k].slice(i-W+1,i+1));if(!o||o.s<LAB.thr[k]||o.r<LAB.r2)continue;if(LAB.cal&&evAt(at(i).getTime()))continue;if(last[k]!=null&&i-last[k]<LAB.cool*6)continue;last[k]=i;out.push([iso(at(i)),k,Math.min(1,o.r),`+${o.s.toFixed(2)}${MET[k][1]}/h en ${LAB.w} h (R²=${o.r.toFixed(2)})`,'Laboratorio: detector de tendencia con tus parámetros. Usa solo datos hasta ese momento.'])}return out}
const alerts=()=>SRC==='ag'?T.al:runLab();
function parseL(s){const L=s.trim().split(/\r?\n/),h=L[0].split(',').map(x=>x.trim()),a=h.indexOf('inicio_incidente'),b=h.indexOf('es_real'),c=h.indexOf('tipo');if(a<0||b<0)return null;return L.slice(1).filter(Boolean).map(r=>{const p=r.split(',');return{t:dt(p[a].trim()),real:p[b].trim().toLowerCase()==='true',tipo:c>=0?(p[c]||'').trim():''}}).filter(x=>!isNaN(x.t))}
function score(al){const G=LABELS[T.id];if(!G)return null;const R=G.filter(l=>l.real),hit=new Set;let tp=0,fp=0;const res=al.map(a=>{for(const r of R){const d=(r.t-dt(a[0]))/6e4;if(d>=-30&&d<=2880){hit.add(r);return d}}return null});res.forEach(d=>d==null?fp++:tp++);const L=res.filter(d=>d!=null);return{res,tp,fp,n:R.length,det:hit.size,pre:tp+fp?tp/(tp+fp):0,lead:L.length?L.reduce((a,b)=>a+b)/L.length:0}}
function chart(k,a,b,marks=[],Hh=170){const y=T.m[k].slice(a,b+1),n=Math.max(b-a,1);let lo=1e9,hi=-1e9;y.forEach(v=>{if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v)}});if(lo>hi)return'<p class="normal">Sin datos</p>';const p=(hi-lo)*.1||1;lo-=p;hi+=p;const X=j=>44+j/n*586,Y=v=>Hh-18-(v-lo)/(hi-lo)*(Hh-28);let s='';
 for(let g=0;g<4;g++){const v=lo+(hi-lo)*g/3;s+=`<line x1="44" x2="630" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="40" y="${Y(v)+3}" text-anchor="end">${v.toFixed(hi-lo<10?1:0)}</text>`}
 T.ev.forEach(e=>{const s0=(dt(e[0])-at(a).getTime())/STEP,z=(dt(e[1])-at(a).getTime())/STEP;if(z>=0&&s0<=n){const x0=X(Math.max(s0,0));s+=`<rect x="${x0}" y="6" width="${Math.max(2,X(Math.min(z,n))-x0)}" height="${Hh-24}" fill="${T.ac}" opacity=".16"><title>${e[2]}</title></rect>`}});
 const tk=Math.max(1,Math.round(n/5));for(let j=0;j<=n;j+=tk)s+=`<text x="${X(j)}" y="${Hh-4}" text-anchor="middle">${at(a+j).toLocaleString('es-MX',{day:'numeric',hour:'2-digit',minute:'2-digit'})}</text>`;
 let d='';y.forEach((v,j)=>{if(v!=null)d+=(d&&y[j-1]!=null?'L':'M')+X(j).toFixed(1)+' '+Y(v).toFixed(1)});s+=`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
 marks.forEach(m=>{if(m.j>=0&&m.j<=n)s+=`<line x1="${X(m.j)}" x2="${X(m.j)}" y1="6" y2="${Hh-18}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="4 3"><title>${m.t||''}</title></line>`});
 return`<div class="eyebrow">${MET[k][0]} (${MET[k][1].trim()})</div><svg viewBox="0 0 640 ${Hh}" style="height:auto;font:10px 'IBM Plex Mono';fill:var(--mut)">${s}</svg>`}
const SEG=(items,cur,k)=>`<div class="seg">${items.map(([v,n])=>`<button class="btn ${v===cur?'p':''}" data-${k}="${v}">${n}</button>`).join('')}</div>`;
function dash(){clearInterval(timer);timer=null;const app=$('#app');document.documentElement.style.setProperty('--ac',T.ac);app.innerHTML='';
 const w=H(`<div><div class="wrap"><div class="top"><div class="brand"><i></i>Vigía</div><div class="who"><div><b>${T.user.n}</b><br><span style="color:var(--mut)">${T.user.r} · ${T.name}</span></div><div class="av">${T.user.n.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><button class="btn" id="out">Salir</button></div></div>
 <div class="tabs" id="tabs">${[['res','Resumen'],['inc','Incidencias'],['dat','Datos'],['lab','Laboratorio']].map(([k,n])=>`<button class="tab" data-k="${k}">${n}</button>`).join('')}</div><div id="pane"></div></div>
 <div class="dock" id="dock"><button class="btn p" id="pl">Reproducir</button><input type="range" id="sl" min="0" max="${nPts()-1}" value="${I}" aria-label="Momento a revisar"><div class="t mono" id="tm"></div><div class="n">Vigía solo usa datos hasta este momento. Nunca ve el futuro.</div></div></div>`);
 app.append(w);$('#out').onclick=()=>{clearInterval(timer);T=null;login()};$('#tabs').onclick=e=>{const k=e.target.dataset.k;if(k)show(k)};
 $('#sl').oninput=e=>{I=+e.target.value;draw()};
 $('#pl').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#pl').textContent='Reproducir';return}$('#pl').textContent='Pausar';timer=setInterval(()=>{if(I>=nPts()-1){$('#pl').click();return}I+=6;$('#sl').value=I;draw()},140)};
 RNG=[0,nPts()-1];show('res')}
function show(k){TAB=k;if(timer){clearInterval(timer);timer=null;$('#pl').textContent='Reproducir'}$('#dock').hidden=k!=='res';document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));({res:pRes,inc:pInc,dat:pDat,lab:pLab})[k]()}
function pRes(){$('#pane').innerHTML=`<div id="hero"></div><h3>Lo que vigilamos en ${T.name}</h3><div class="grid" id="mets"></div><div class="cols"><div><h3>Avisos</h3><div class="stack" id="als"></div></div><div class="stack"><div class="card"><h3>Calendario del negocio</h3><div id="evs"></div></div><div class="card"><h3>Qué es normal aquí</h3><p class="normal">${T.normal}</p></div><div class="card"><h3>Pistas del sistema</h3><div id="lgs"></div></div></div></div>`;draw()}
function pInc(){const al=alerts().slice().sort((a,b)=>dt(a[0])-dt(b[0])),sc=score(al);
 $('#pane').innerHTML=`<h3>Incidencias detectadas en ${T.name}</h3><p class="normal" style="margin-bottom:10px">Cada fila es un aviso. Haz clic para ver todas las métricas y los registros alrededor del momento en que se generó.</p>${SEG([['ag','Agente SRE'],['lab','Laboratorio']],SRC,'src')}
 ${sc?`<div class="card" style="margin:10px 0"><b>Contra tus etiquetas:</b> ${sc.det}/${sc.n} incidentes reales detectados · ${sc.fp} falsas alarmas · precisión ${(sc.pre*100).toFixed(0)}% · anticipación media ${(sc.lead/60).toFixed(1)} h</div>`:''}
 <div class="cols"><div class="card" style="overflow:auto"><table><tr><th>#</th><th>Momento</th><th>Qué vio</th><th>Conf.</th><th>Calendario</th>${sc?'<th>Resultado</th>':''}</tr>${al.map((a,i)=>{const e=evAt(dt(a[0]));return`<tr data-i="${i}"><td>${i+1}</td><td class="mono">${fmt(new Date(a[0]))}</td><td>${TITLE[a[1]]}</td><td>${Math.round(a[2]*100)}%</td><td>${e?`<span class="chip warn">${e[2]}</span>`:'<span class="chip">libre</span>'}</td>${sc?`<td>${sc.res[i]==null?'<span class="chip bad">falsa alarma</span>':`<span class="chip ok">${(sc.res[i]/60).toFixed(1)} h antes</span>`}</td>`:''}</tr>`}).join('')||'<tr><td colspan="6">Sin avisos con estos parámetros.</td></tr>'}</table></div><div id="det" class="stack"><div class="card"><p class="normal">Elige una incidencia de la tabla.</p></div></div></div>`;
 $('#pane').onclick=e=>{const s=e.target.closest('[data-src]');if(s){SRC=s.dataset.src;pInc();return}const r=e.target.closest('tr[data-i]');if(r){document.querySelectorAll('tr[data-i]').forEach(x=>x.classList.remove('sel'));r.classList.add('sel');detail(al[+r.dataset.i])}}}
function detail(a){const i=idx(a[0]),a0=Math.max(0,i-DAY),b0=Math.min(nPts()-1,i+36);
 const logs=T.lg.filter(l=>!l[4]&&Math.abs(dt(l[0])-dt(a[0]))<=216e5).sort((x,y)=>dt(x[0])-dt(y[0]));
 $('#det').innerHTML=`<div class="card"><h3>${TITLE[a[1]]}</h3><p class="mono" style="font-size:13px">${a[0].replace('T',' ')} · confianza ${Math.round(a[2]*100)}%</p><p class="normal">${T.imp[a[1]]||''}</p><p class="hint">Vista de análisis: muestra 6 h después solo para estudiar el caso. La alerta se generó con datos hasta la línea punteada.</p></div>
 <div class="card">${T.ord.map(k=>chart(k,a0,b0,[{j:i-a0,t:'Aviso'}],120)).join('')}</div>
 <div class="card"><h3>Valores en ese momento</h3><table><tr><th>Métrica</th><th>Valor</th><th>Normal a esta hora</th><th>Lectura</th></tr>${T.ord.map(k=>{const s=state(k,i),b=base(k,i);return`<tr><td>${MET[k][0]}</td><td class="mono">${s.v==null?'—':s.v.toFixed(1)}</td><td class="mono">${b?b.m.toFixed(1)+' ± '+(2*b.s).toFixed(1):'sin historial'}</td><td><span class="chip ${s.c}">${s.t}</span></td></tr>`}).join('')}</table></div>
 <div class="card"><h3>Registros ±3 h</h3>${logs.map(l=>`<div class="lg"><span class="mono ${l[1][0]}">${l[1]}</span> <b>${l[3]}</b><br><span style="color:var(--mut)">${l[0].replace('T',' ')} · ${l[2]}</span></div>`).join('')||'<p class="normal">Sin registros relevantes en la ventana.</p>'}</div>
 <div class="card"><details open><summary>Detalle técnico</summary><p class="mono">${a[3]}</p><p>${a[4]}</p></details></div>`}
function pDat(){const n=nPts();$('#pane').innerHTML=`<h3>Datos de ${T.name}</h3><p class="normal" style="margin-bottom:10px">Métricas promediadas cada 10 minutos y registros completos del servidor, firewall y aplicación. Las zonas sombreadas son eventos programados.</p>${SEG(Object.keys(MET).map(k=>[k,MET[k][0]]),DM,'dm')}
 <div class="card" style="margin:10px 0"><div id="dch"></div><div class="rng"><label>Desde <input type="range" id="r0" min="0" max="${n-2}" value="${RNG[0]}"></label><label>Hasta <input type="range" id="r1" min="1" max="${n-1}" value="${RNG[1]}"></label></div></div>
 <div class="card" style="overflow:auto;max-height:340px"><table id="dtb"></table></div><details class="card" style="margin-top:10px"><summary>CSV del rango (copiar y pegar)</summary><textarea id="csv" readonly rows="6"></textarea></details>
 <h3 style="margin-top:22px">Registros</h3><div class="rng"><input id="lq" placeholder="Buscar texto…"><select id="lv"><option value="r">Solo los poco comunes</option><option value="w">Solo WARN y ERROR</option><option value="a">Todos (incluye ruido)</option></select><span class="chip" id="lc"></span></div><div class="card" style="overflow:auto;max-height:380px;margin-top:8px"><table id="ltb"></table></div>`;
 const dd=()=>{let[a,b]=RNG;const ms=alerts().map(x=>({j:idx(x[0])-a,t:TITLE[x[1]]}));$('#dch').innerHTML=chart(DM,a,b,ms,200);const st=Math.max(1,Math.ceil((b-a+1)/200)),rows=[];for(let j=a;j<=b;j+=st)rows.push(j);
  $('#dtb').innerHTML=`<tr><th>Momento</th>${Object.keys(MET).map(k=>`<th>${MET[k][0]}</th>`).join('')}</tr>`+rows.map(j=>`<tr><td class="mono">${iso(at(j)).replace('T',' ')}</td>${Object.keys(MET).map(k=>`<td class="mono">${T.m[k][j]==null?'<span style="color:var(--bad)">vacío</span>':T.m[k][j]}</td>`).join('')}</tr>`).join('');
  let c='timestamp,cpu,ram,disco,latencia_ms,errores\n';for(let j=a;j<=b;j++)c+=iso(at(j))+','+Object.keys(MET).map(k=>T.m[k][j]??'').join(',')+'\n';$('#csv').value=c};
 const ll=()=>{const q=$('#lq').value.toLowerCase(),m=$('#lv').value,L=T.lg.filter(l=>(m==='a'||(m==='r'?!l[4]:l[1]==='WARN'||l[1]==='ERROR'))&&(!q||(l[3]+l[2]).toLowerCase().includes(q)));$('#lc').textContent=L.length+' líneas';$('#ltb').innerHTML=L.slice(0,400).map(l=>`<tr><td class="mono">${l[0].replace('T',' ')}</td><td class="mono ${l[1][0]}">${l[1]}</td><td>${l[2]}</td><td>${l[3]}</td></tr>`).join('')};
 $('#pane').onclick=e=>{const s=e.target.closest('[data-dm]');if(s){DM=s.dataset.dm;pDat()}};$('#r0').oninput=e=>{RNG[0]=Math.min(+e.target.value,RNG[1]-1);dd()};$('#r1').oninput=e=>{RNG[1]=Math.max(+e.target.value,RNG[0]+1);dd()};$('#lq').oninput=ll;$('#lv').onchange=ll;dd();ll()}
function pLab(){const rg=(k,lbl,mn,mx,st,v,u)=>`<label>${lbl}: <b id="v_${k}">${v}</b> ${u}<input type="range" data-p="${k}" min="${mn}" max="${mx}" step="${st}" value="${v}"></label>`;
 $('#pane').innerHTML=`<h3>Laboratorio de detección</h3><p class="normal" style="margin-bottom:10px">Ajusta el detector y mira al instante qué avisaría en ${T.name}. Cada aviso en el minuto t usa solo datos hasta t. El agente actual mira apenas 60 minutos; aquí puedes probar ventanas de horas o días.</p>
 <div class="cols"><div class="card stack">${rg('w','Ventana de tendencia',1,72,1,LAB.w,'h')}${rg('r2','Regularidad mínima (R²)',.3,.95,.05,LAB.r2,'')}${rg('cool','Pausa entre avisos',0,48,1,LAB.cool,'h')}${Object.keys(LAB.thr).map(k=>rg(k,'Subida mínima de '+MET[k][0].toLowerCase(),0.05,k==='latencia_ms'?60:3,k==='latencia_ms'?1:.05,LAB.thr[k],MET[k][1].trim()+'/h')).join('')}<label><input type="checkbox" id="cal" ${LAB.cal?'checked':''}> Ignorar eventos del calendario del negocio</label></div>
 <div class="stack"><div class="card"><div id="lres"></div></div><div class="card"><h3>Calificar con tus etiquetas</h3><p class="hint">Pega el <span class="mono">etiquetas.csv</span> de tu copia local (columnas inicio_incidente, tipo, es_real). Solo se usa para calificar; el detector nunca lo lee.</p><textarea id="lbl" rows="4" placeholder="inicio_incidente,tipo,es_real"></textarea><button class="btn" id="lgo" style="margin-top:6px">Calcular</button><div id="lsc" class="normal" style="margin-top:8px">${LABELS[T.id]?'Etiquetas cargadas.':''}</div></div></div></div>`;
 const up=()=>{SRC='lab';const al=runLab(),sc=score(al);$('#lres').innerHTML=`<h3>${al.length} avisos</h3>${SEG(Object.keys(MET).map(k=>[k,MET[k][0]]),DM,'dm')}${chart(DM,0,nPts()-1,al.map(a=>({j:idx(a[0]),t:TITLE[a[1]]})),170)}${sc?`<p><b>${sc.det}/${sc.n}</b> reales detectados · <b>${sc.fp}</b> falsas alarmas · anticipación media <b>${(sc.lead/60).toFixed(1)} h</b></p>`:'<p class="hint">Líneas punteadas = avisos. Sin etiquetas aún.</p>'}`};
 $('#pane').oninput=e=>{const p=e.target.dataset.p;if(p){const v=+e.target.value;({w:()=>LAB.w=v,r2:()=>LAB.r2=v,cool:()=>LAB.cool=v})[p]?.();if(LAB.thr[p]!==undefined)LAB.thr[p]=v;$('#v_'+p).textContent=v;up()}else if(e.target.id==='cal'){LAB.cal=e.target.checked;up()}};
 $('#pane').onclick=e=>{const s=e.target.closest('[data-dm]');if(s){DM=s.dataset.dm;up()}if(e.target.id==='lgo'){const r=parseL($('#lbl').value);if(!r){$('#lsc').textContent='No pude leer el CSV: faltan columnas inicio_incidente o es_real.';return}LABELS[T.id]=r;$('#lsc').textContent=r.length+' etiquetas cargadas.';up()}};up()}
function draw(){
 const now=at(I).getTime(),act=T.al.filter(a=>dt(a[0])<=now&&now-dt(a[0])<=36e5*36).sort((a,b)=>dt(b[0])-dt(a[0])),cur=T.ev.find(e=>now>=dt(e[0])&&now<=dt(e[1]));
 const x=act[0],onEv=x&&evAt(dt(x[0]));
 $('#hero').outerHTML=`<div id="hero" class="hero ${x?(onEv?'warn':'bad'):''}"><div class="eyebrow">${fmt(at(I))}</div>`+(x?
  `<h2>${onEv?'Posible señal — conviene revisar':'Atención: '+TITLE[x[1]]}</h2><p>${T.imp[x[1]]}${onEv?` Coincide con «${onEv[2]}», así que podría ser carga normal; confírmalo antes de actuar.`:''}</p><p class="mono" style="margin-top:8px;font-size:13px">Detectado hace ${ago(now-dt(x[0]))} · confianza ${Math.round(x[2]*100)}%</p>`:
  `<h2>Todo en orden</h2><p>No vemos señales de incidente en las últimas 36 horas.${cur?` Ahora mismo está en curso «${cur[2]}»: es un evento programado y no lo tratamos como falla.`:''}</p>`)+`</div>`;
 $('#tm').textContent=fmt(at(I));
 $('#mets').innerHTML=T.ord.map((k,n)=>{const s=state(k,I),u=MET[k];return`<div class="card ${n===0?'big':''}"><div class="m-h"><span>${u[0]}${n===0?' · la que más importa en '+T.name:''}</span><span class="chip ${s.c}">${s.t}</span></div><div class="val">${s.v==null?'—':(k==='latencia_ms'||k==='errores'?Math.round(s.v*10)/10:s.v.toFixed(1))}<small>${u[1]}</small></div>${spark(k,I)}</div>`}).join('');
 $('#als').innerHTML=T.al.filter(a=>dt(a[0])<=now).sort((a,b)=>dt(b[0])-dt(a[0])).slice(0,6).map(a=>{const e=evAt(dt(a[0]));return`<div class="card al ${a[2]>=.85?'hi':''}"><div class="m-h"><span class="mono">${fmt(new Date(a[0]))}</span><span><span class="bar"><i style="width:${a[2]*100}%"></i></span> ${Math.round(a[2]*100)}%</span></div><h4>${TITLE[a[1]]}</h4><p>${T.imp[a[1]]}</p>${e?`<span class="chip warn">Dentro de «${e[2]}» · confirmar</span>`:''}<details><summary>Detalle técnico</summary><p class="mono">${a[3]}</p><p>${a[4]}</p></details></div>`}).join('')||'<div class="card"><p class="normal">Aún no hay avisos en este momento de la semana.</p></div>';
 const up=T.ev.filter(e=>dt(e[1])>=now-36e5&&dt(e[0])<=now+36e5*30).sort((a,b)=>dt(a[0])-dt(b[0])).slice(0,5);
 $('#evs').innerHTML=up.map(e=>{const on=now>=dt(e[0])&&now<=dt(e[1]);return`<div class="ev"><span>${e[2]}</span><span class="chip ${on?'ok':''}">${on?'En curso':fmt(new Date(e[0]))}</span></div>`}).join('')||'<p class="normal">Sin eventos próximos.</p>';
 $('#lgs').innerHTML=T.lg.filter(l=>!l[4]&&dt(l[0])<=now).slice(-7).reverse().map(l=>`<div class="lg"><span class="mono ${l[1][0]}">${l[1]}</span> <b>${l[3]}</b><br><span style="color:var(--mut)">${fmt(new Date(l[0]))} · ${l[2]}</span></div>`).join('')||'<p class="normal">Sin pistas todavía.</p>'}
login();
</script></body></html>
